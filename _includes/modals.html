{% for post in site.posts %}
<div class="portfolio-modal modal fade" id="portfolioModal{{ post.modal-id }}" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-content">
        <div class="close-modal" data-dismiss="modal">
            <div class="lr">
                <div class="rl"></div>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-lg-8 col-lg-offset-2">
                    <div class="modal-body" style="color: #000;">
                        <h2>{{ post.title }}</h2>
                        <hr class="star-primary">
                        <img src="img/portfolio/{{ post.img }}" class="img-responsive img-centered" alt="{{ post.alt }}">
                        <p>{{ post.description }}</p>
                        <ul class="list-inline item-details">
                            <li>Client:
                                <strong><a href="#">{{ post.client }}</a></strong>
                            </li>
                            <li>Date:
                                <strong><a href="#">{{ post.project-date }}</a></strong>
                            </li>
                            <li>Service:
                                <strong><a href="#">{{ post.category }}</a></strong>
                            </li>
                        </ul>

                        <!-- Stlite Integration -->
                        {% if post.stlite %}
                        <div id="stlite-app-{{ post.modal-id }}" style="width: 150%; height: 500px; margin-top: 20px;"></div>
                        
                        <script type="module">
                            import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.2/build/stlite.js";

                            mount(
                                {
                                    requirements: ["streamlit"], // Optional: Add additional requirements here if needed
                                    entrypoint: "streamlit_app.py", // Entry point of your Streamlit app
                                    files: {
                                        "streamlit_app.py": `{{ post.stlite }}`
                                    },
                                    streamlitConfig: {
                                        "theme.base": "light", // Set the theme to light
                                        "ui.hideTopBar" : "true",
                                        "client.toolbarMode": "minimal"
                                    },
                                },
                                document.getElementById("stlite-app-{{ post.modal-id }}")
                            );
                        </script>
                        {% endif %}

                        <button type="button" class="btn btn-default" data-dismiss="modal"><i class="fa fa-times"></i> Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endfor %}
