<!-- Team Section -->
<section id="team" class="bg-light-gray">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Founder</h2>
                <h3 class="section-subheading text-muted">Leith Research was established in 2024 in Edinburgh</h3>
            </div>
        </div>
        <div class="row d-flex justify-content-center align-items-center">
            {% for member in site.people %}
            <div class="col-sm-12 text-center">
                <div class="team-member text-center">
                    <img src="img/team/{{ member.pic }}.jpg" class="img-responsive img-circle" alt="" style="height: 35vh;">
                    <h4 class="text-dark">{{ member.name }}</h4>
                    <p class="text-muted">{{ member.position }}</p>
                    <ul class="list-inline social-buttons">
                        {% for network in member.social %}
                        <li>
                            <a href="{{ network.url }}">
                                <i class="fa-brands fa-{{ network.title }}"></i>
                            </a>
                        </li>
                        {% endfor %}

                    </ul>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
