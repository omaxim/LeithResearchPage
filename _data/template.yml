# Color settings (hex-codes without the leading hash-tag)
color:
  primary: 364f6b  # Main dark blue
  secondary: 3fc1c9  # Light cyan
  accent: f5f5f5  # Light gray
  tertiary: fc5185  # Pinkish red
  secondary-dark: 333  # Dark gray for secondary elements
  muted: 777  # Muted gray for text

# Font Families
font:
  primary: 'League Spartan, "Helvetica Neue", Helvetica, Arial, sans-serif'  # League Spartan as the primary font
  secondary: '"Times New Roman", serif'  # Times New Roman as the secondary font
